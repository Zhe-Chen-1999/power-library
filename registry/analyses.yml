## Index of power analyses. One entry per analysis.
## After editing, run:  source("R/load.R"); build_index()
##
## Fields (keep them all filled in -- the point is to be able to sort on them):
##   id         short slug, matches the analyses/ subdirectory
##   title      what the analysis was for
##   study      trial or grant name
##   year       when it was run
##   analyst    who ran it
##   design     parallel-arm RCT / cluster-randomised / stepped wedge / ...
##   outcome    binary / continuous / time-to-event / ordinal / count
##   framework  frequentist / Bayesian
##   n_arms     number of arms
##   features   ICC, repeated measures, multiplicity, competing risks, interim looks
##   design_fn  design constructor in R/ that implements it, if any
##   path       link to the Markdown or code
##   status     draft / final / used-in-submission

analyses:
  - id: 2026-09_pcori-3arm-binary
    title: Sample size and power for a three-arm pragmatic trial, plus rural/urban subgroup power
    study: PCORI LOI
    year: '2026'
    analyst: Zhe Chen
    design: Parallel-arm RCT, individually randomised
    outcome: Binary
    framework: frequentist
    n_arms: '3'
    features: 'Two non-symmetric active arms; Bonferroni across 2 primary and 3 pairwise comparisons; prespecified subgroup power at a 1/3 vs 2/3 split; fixed N = 3000 budget'
    design_fn: binary_parallel
    path: analyses/2026-09_pcori-3arm-binary/analysis.Rmd
    status: final

  - id: 2025-09_parma-weibull-bayes
    title: Bayesian power to detect a >90% posterior probability of benefit in time to hypoxemia resolution
    study: PARMA (pediatric ARDS, high vs low driving pressure)
    year: '2025'
    analyst: Zhe Chen, Nadir Yehya
    design: Parallel-arm RCT, Bayesian analysis
    outcome: Time-to-event
    framework: Bayesian
    n_arms: '2'
    features: Weibull PH model in JAGS; death as competing event handled as cause-specific censoring; 28-day administrative censoring; posterior-probability decision rule; prior sensitivity on the treatment-effect precision
    design_fn: weibull_bayes
    path: analyses/2025-09_parma-weibull-bayes/analysis.Rmd
    status: used-in-submission
